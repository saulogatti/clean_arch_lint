name: Publish to pub.dev

# Requires "Automated publishing" enabled on pub.dev (Admin tab of the package) for this repository
# with the tag pattern `v{{version}}`.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

jobs:
  publish:
    permissions:
      id-token: write
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
