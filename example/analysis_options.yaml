include:
  - package:flutter_lints/flutter.yaml

analyzer:

  exclude:
    - build/**
plugins:
  clean_arch_lint:
    path: ../
    diagnostics:
      core_no_flutter: true
      data_no_presentation: false
      presentation_no_data: false # enable to see the error, default is warning
      domain_only: true
      teste_meu: false # disable to not see the warning. Default is true.



